<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MESS HALL — weekly loadout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil:wght@500;700;800&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1013;
    --bg-alt:#15171B;
    --panel:#1B1E23;
    --panel-2:#20242A;
    --line:#2B3038;
    --line-soft:#23262C;
    --ink:#ECE8DD;
    --ink-dim:#9BA0A8;
    --ink-faint:#5C616A;
    --accent:#E0A72E;
    --accent-dim:#8A6A1E;
    --teal:#3FA6A0;
    --brick:#C1573B;
    --violet:#8B6FB0;
    --fiber:#8FAE4E;
    --locked:#494E56;
    --radius:6px;
    --display:'Big Shoulders Stencil', sans-serif;
    --cond:'Barlow Condensed', sans-serif;
    --body:'Barlow', sans-serif;
    --mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); -webkit-font-smoothing:antialiased;}
  button{font-family:inherit; cursor:pointer; color:inherit;}
  h1,h2,h3,h4{margin:0; font-family:var(--display); font-weight:700; letter-spacing:0.02em; color:var(--ink);}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  a{color:var(--accent);}

  #shell{display:flex; min-height:100vh;}

  /* ---------------- RAIL ---------------- */
  .rail{
    width:210px; flex-shrink:0; background:var(--bg-alt); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:18px 0;
  }
  .rail-brand{padding:0 18px 20px; border-bottom:1px solid var(--line); margin-bottom:10px;}
  .rail-brand .word{font-family:var(--display); font-size:26px; letter-spacing:0.03em; color:var(--accent); line-height:1;}
  .rail-brand .sub{font-family:var(--mono); font-size:9.5px; color:var(--ink-faint); letter-spacing:0.12em; margin-top:3px; text-transform:uppercase;}
  .rail-item{
    display:flex; align-items:center; gap:11px; padding:11px 18px; border-left:3px solid transparent;
    color:var(--ink-dim); font-family:var(--cond); font-size:15.5px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase;
    background:transparent; border-top:none; border-right:none; border-bottom:none; width:100%; text-align:left;
    transition:background .12s ease, color .12s ease;
  }
  .rail-item svg{width:18px; height:18px; flex-shrink:0; opacity:0.85;}
  .rail-item:hover{background:var(--panel); color:var(--ink);}
  .rail-item.active{background:var(--panel-2); border-left-color:var(--accent); color:var(--accent);}
  .rail-item.locked{color:var(--ink-faint);}
  .rail-item.locked .lock-tag{margin-left:auto; font-family:var(--mono); font-size:8.5px; background:var(--locked); color:var(--bg); padding:2px 5px; border-radius:3px; letter-spacing:0.05em;}
  .rail-foot{margin-top:auto; padding:14px 18px 0; font-family:var(--mono); font-size:10px; color:var(--ink-faint); border-top:1px solid var(--line);}

  /* ---------------- MAIN ---------------- */
  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{
    padding:16px 26px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap;
    background:linear-gradient(180deg, var(--bg-alt), var(--bg));
  }
  .topbar h1{font-size:26px;}
  .topbar p{margin:2px 0 0; color:var(--ink-dim); font-size:13.5px; font-family:var(--body);}
  .content{padding:24px 26px 90px; max-width:1240px;}

  .btn{border:none; border-radius:4px; padding:10px 18px; font-weight:700; font-size:13px; font-family:var(--cond); letter-spacing:0.04em; text-transform:uppercase; display:inline-flex; align-items:center; gap:7px; transition:transform .1s ease, filter .12s ease;}
  .btn:active{transform:translateY(1px);}
  .btn-accent{background:var(--accent); color:#1A1502;}
  .btn-accent:hover{filter:brightness(1.1);}
  .btn-ghost{background:transparent; border:1.5px solid var(--line); color:var(--ink);}
  .btn-ghost:hover{border-color:var(--accent); color:var(--accent);}
  .btn-danger{background:var(--brick); color:#fff;}
  .btn-danger:hover{filter:brightness(1.1);}
  .btn-danger-text{background:none; border:none; color:var(--brick); font-family:var(--cond); font-weight:700; font-size:12px; letter-spacing:0.03em; text-transform:uppercase;}
  .btn-sm{padding:7px 12px; font-size:11.5px;}

  .chiprow{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px;}
  .chip{background:var(--panel); border:1.5px solid var(--line); color:var(--ink-dim); padding:6px 14px; border-radius:4px; font-family:var(--cond); font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:0.03em;}
  .chip.active{background:var(--accent); border-color:var(--accent); color:#1A1502;}
  .chip-add{border-style:dashed; color:var(--accent); border-color:var(--accent-dim); background:transparent;}
  .chip-add:hover{border-color:var(--accent); background:var(--panel-2);}
  .chiprow-label{font-family:var(--mono); font-size:10px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.06em; align-self:center; margin-right:2px;}
  .cuisine-tag{border-color:var(--accent); color:var(--accent);}

  /* ---------------- ARMORY GRID ---------------- */
  .recipe-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:16px;}
  .rcard{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; display:flex; flex-direction:column; position:relative; opacity:0; animation:riseIn .4s ease forwards;}
  .recipe-grid .rcard:nth-child(1){animation-delay:.02s} .recipe-grid .rcard:nth-child(2){animation-delay:.05s}
  .recipe-grid .rcard:nth-child(3){animation-delay:.08s} .recipe-grid .rcard:nth-child(4){animation-delay:.11s}
  .recipe-grid .rcard:nth-child(n+5){animation-delay:.13s}
  @keyframes riseIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  .rcard-top{background:var(--panel-2); padding:14px 14px 10px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:flex-start;}
  .rcard-emoji{font-size:30px;}
  .cal-badge{font-family:var(--mono); font-size:11px; text-align:right; color:var(--accent);}
  .cal-badge b{display:block; font-size:16px; line-height:1.1;}
  .rcard-body{padding:12px 14px 8px; flex:1;}
  .rcard-title{font-family:var(--cond); font-size:17px; font-weight:700; letter-spacing:0.02em; margin-bottom:4px; text-transform:uppercase;}
  .rcard-meta{font-family:var(--mono); font-size:10.5px; color:var(--ink-dim); display:flex; gap:10px; margin-bottom:10px;}
  .macrobar{height:6px; border-radius:3px; overflow:hidden; display:flex; background:var(--line-soft); margin-bottom:5px;}
  .macrobar span{height:100%;}
  .macro-legend{display:flex; gap:10px; font-family:var(--mono); font-size:9.5px; color:var(--ink-faint);}
  .macro-legend i{display:inline-block; width:7px; height:7px; border-radius:2px; margin-right:3px; vertical-align:middle;}
  .tag-row{display:flex; flex-wrap:wrap; gap:5px; padding:0 14px 10px;}
  .tag{font-size:9.5px; font-weight:700; background:var(--panel-2); border:1px solid var(--line); color:var(--ink-dim); padding:2px 7px; border-radius:3px; text-transform:uppercase; letter-spacing:0.04em;}
  .rcard-actions{margin-top:10px; padding:10px 14px 14px; display:flex; gap:8px; border-top:1px solid var(--line-soft);}
  .in-loadout-note{font-family:var(--mono); font-size:10px; color:var(--accent); padding:0 14px 10px;}

  .add-card{border:1.5px dashed var(--line); border-radius:var(--radius); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:var(--ink-dim); font-family:var(--cond); font-weight:700; text-transform:uppercase; letter-spacing:0.03em; min-height:190px;}
  .add-card:hover{border-color:var(--accent); color:var(--accent);}
  .add-card .plus{font-size:26px; font-family:var(--display);}

  /* ---------------- BUILDER (merged weekly grid + pool) ---------------- */
  .stats-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:10px; flex-wrap:wrap;}
  .stat-tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:14px;}
  .stat-tile{position:relative; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px;}
  .stat-tile.edit{border-color:var(--accent-dim); border-style:dashed;}
  .stat-tile .label{font-family:var(--mono); font-size:9.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.08em;}
  .stat-tile .value{font-family:var(--display); font-size:28px; color:var(--accent); line-height:1.2;}
  .stat-tile .value small{font-family:var(--cond); font-size:13px; color:var(--ink-dim);}
  .stat-remove{position:absolute; top:6px; right:6px; width:20px; height:20px; border-radius:50%; background:var(--panel-2); border:1px solid var(--line); color:var(--ink-dim); font-size:10px; display:flex; align-items:center; justify-content:center; padding:0;}
  .stat-remove:hover{border-color:var(--brick); color:var(--brick);}
  .stat-empty{grid-column:1/-1; color:var(--ink-faint); font-family:var(--mono); font-size:12px; padding:10px 0;}
  .stats-add-row{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0 0 22px;}

  .section-label{font-family:var(--cond); font-weight:700; font-size:14px; text-transform:uppercase; letter-spacing:0.03em; color:var(--ink-dim); margin:4px 0 10px;}

  .loadgrid-wrap{overflow-x:auto; margin-bottom:16px; border-radius:var(--radius);}
  .loadgrid{display:grid; grid-template-columns:60px repeat(7, minmax(98px,1fr)); gap:6px; min-width:800px;}
  .lg-daylabel{font-family:var(--cond); font-weight:700; font-size:12.5px; text-align:center; color:var(--ink-dim); text-transform:uppercase; padding:6px 0;}
  .lg-meallabel{font-family:var(--mono); font-size:9.5px; color:var(--ink-faint); display:flex; align-items:center; justify-content:flex-end; padding-right:5px; text-transform:uppercase;}
  .lg-cell{position:relative; width:100%; height:100%; background:var(--panel); border:1.5px dashed var(--line-soft); border-radius:4px; min-height:66px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:6px 4px; gap:2px;}
  .lg-cell:hover{border-color:var(--ink-dim);}
  .lg-cell.drag-over{border-color:var(--accent); background:#2A2410;}
  .lg-cell.filled{border-style:solid; border-color:var(--accent); background:var(--panel-2);}
  .lg-cell .emoji{font-size:17px;}
  .lg-cell .t{font-family:var(--cond); font-weight:700; font-size:10px; color:var(--ink); text-transform:uppercase; line-height:1.15; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
  .lg-cell .cal{font-family:var(--mono); font-size:8.5px; color:var(--accent);}
  .lg-cell .ghost{font-size:15px; color:var(--ink-faint);}
  .lg-add-snack{background:transparent; border:1.5px dashed var(--line-soft); border-radius:4px; min-height:66px; width:100%; display:flex; align-items:center; justify-content:center; color:var(--ink-faint); font-size:16px; font-family:var(--display);}
  .lg-add-snack:hover{border-color:var(--accent); color:var(--accent);}
  .lg-cell-wrap{position:relative;}
  .lg-remove-snack{position:absolute; top:3px; right:3px; width:16px; height:16px; border-radius:50%; background:var(--panel); border:1px solid var(--line); color:var(--ink-faint); font-size:8.5px; line-height:1; display:flex; align-items:center; justify-content:center; padding:0;}
  .lg-remove-snack:hover{border-color:var(--brick); color:var(--brick);}

  .lg-divider{grid-column:1/-1; display:flex; align-items:center; justify-content:space-between; gap:10px; margin:8px 0 2px; padding-top:8px; border-top:1px solid var(--line-soft);}
  .lg-divider-label{font-family:var(--mono); font-weight:600; font-size:10px; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-faint);}
  .lg-nut-chiprow{grid-column:1/-1; display:flex; flex-wrap:wrap; gap:8px; margin-bottom:4px;}
  .nut-chip{background:var(--panel-2);}
  .lg-nut-label{font-family:var(--mono); font-weight:700; font-size:9.5px; text-transform:uppercase; letter-spacing:0.06em; justify-content:flex-end;}
  .lg-nut-cell{background:var(--panel-2); border:1px solid var(--line-soft); border-radius:4px; min-height:52px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:var(--mono); font-weight:700; font-size:15px;}
  .lg-nut-cell .u{font-size:8px; color:var(--ink-faint); font-weight:400; text-transform:uppercase; margin-top:2px; letter-spacing:0.06em;}
  .lg-nut-empty{grid-column:1/-1; color:var(--ink-faint); font-family:var(--mono); font-size:12px; padding:10px 0;}

  .pool-panel-wide{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:22px;}
  .pool-panel-wide h3{font-size:15px; text-transform:uppercase; letter-spacing:0.04em; font-family:var(--cond); margin-bottom:2px;}
  .pool-sub{font-family:var(--mono); font-size:10.5px; color:var(--ink-faint); margin-bottom:6px;}
  .pool-empty{color:var(--ink-dim); font-size:13px; padding:10px 0; font-family:var(--body);}
  .pool-items-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:12px; margin-top:8px;}
  .pool-item-card{background:var(--panel-2); border:1px solid var(--line-soft); border-radius:4px; padding:12px;}
  .pool-item-head{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .pool-item-title{font-family:var(--cond); font-weight:700; font-size:14px; text-transform:uppercase;}
  .pool-item-sub{font-family:var(--mono); font-size:9.5px; color:var(--ink-faint); margin-top:2px;}
  .batch-row{border-top:1px dashed var(--line-soft); padding-top:9px; margin-top:9px;}
  .batch-row.first{border-top:none; padding-top:0;}
  .batch-row-head{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .batch-label{font-family:var(--mono); font-size:9.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.05em;}
  .btn-xs{font-size:9.5px; padding:2px 6px;}
  .hexrail{display:flex; flex-wrap:wrap; gap:8px; margin-top:9px;}
  .hex{
    width:32px; height:30px; background:var(--accent); border:none; color:#1A1502; font-family:var(--mono); font-weight:700; font-size:11px;
    clip-path:polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    display:flex; align-items:center; justify-content:center; transition:transform .12s ease;
    cursor:grab;
  }
  .hex:active{cursor:grabbing;}
  .hex:hover{transform:scale(1.08);}
  .hex.dragging{opacity:0.4;}
  .hex.placed{background:var(--locked); color:var(--bg); opacity:0.5; cursor:default;}
  .select-hint{margin-top:12px; background:var(--panel-2); border-left:3px solid var(--accent); border-radius:3px; padding:8px 10px; font-size:11.5px; color:var(--accent); font-family:var(--mono);}

  .confirm-box{background:linear-gradient(135deg, var(--panel-2), var(--panel)); border:1px solid var(--accent-dim); border-radius:var(--radius); padding:20px; display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap;}
  .confirm-box p{margin:4px 0 0; color:var(--ink-dim); font-size:13px; max-width:520px;}

  /* ---------------- SUPPLY LIST ---------------- */
  .supply-lede{font-family:var(--mono); font-size:11.5px; color:var(--ink-dim); margin-bottom:18px;}
  .add-item-row{
    display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:var(--panel);
    border:1px solid var(--line); border-radius:var(--radius); padding:12px; margin-bottom:18px;
  }
  .add-item-row input, .add-item-row select{
    background:var(--panel-2); border:1.5px solid var(--line); border-radius:4px; color:var(--ink);
    font-family:var(--body); font-size:13px; padding:8px 10px;
  }
  .add-item-row #extra-item-name{flex:2; min-width:160px;}
  .add-item-row #extra-item-qty{width:60px;}
  .add-item-row #extra-item-unit{width:110px;}
  .add-item-row select{font-family:var(--body);}
  .extra-remove{
    background:none; border:none; color:var(--ink-faint); width:18px; height:18px; border-radius:4px;
    font-size:11px; flex-shrink:0; margin-top:2px; padding:0;
  }
  .extra-remove:hover{color:var(--brick);}
  .shop-cats{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px;}
  .shop-cat{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px;}
  .shop-cat h4{font-family:var(--cond); font-size:14px; text-transform:uppercase; letter-spacing:0.04em; color:var(--accent); margin-bottom:8px;}
  .shop-row{display:flex; align-items:flex-start; gap:9px; padding:6px 0; border-top:1px dashed var(--line-soft);}
  .shop-row:first-of-type{border-top:none;}
  .shop-check{width:18px; height:18px; border-radius:3px; border:1.5px solid var(--ink-faint); flex-shrink:0; margin-top:2px; background:transparent; display:flex; align-items:center; justify-content:center;}
  .shop-check.on{background:var(--accent); border-color:var(--accent); color:#1A1502; font-size:12px;}
  .shop-text{font-size:13.5px; line-height:1.3; flex:1; min-width:0;}
  .shop-qty{font-family:var(--mono); font-weight:700; color:var(--accent); margin-right:5px;}
  .shop-row.checked .shop-text{text-decoration:line-through; color:var(--ink-faint);}
  .shop-src{display:block; font-size:10px; color:var(--ink-faint); margin-top:1px;}
  .info-btn{
    width:18px; height:18px; border-radius:50%; flex-shrink:0; margin-top:2px;
    background:transparent; border:1.5px solid var(--ink-faint); color:var(--ink-faint);
    display:flex; align-items:center; justify-content:center; padding:0;
    transition:border-color .12s ease, color .12s ease;
  }
  .info-btn:hover{border-color:var(--accent); color:var(--accent);}

  .locked-page{background:var(--panel); border:1px dashed var(--line); border-radius:var(--radius); padding:50px 30px; text-align:center; max-width:560px;}
  .locked-page .lock-icon{font-size:34px; margin-bottom:10px;}
  .locked-page h2{margin-bottom:8px;}
  .locked-page p{color:var(--ink-dim); font-size:14px; line-height:1.5;}
  .locked-page .tagline{font-family:var(--mono); font-size:10.5px; color:var(--locked); text-transform:uppercase; letter-spacing:0.1em; margin-bottom:14px; display:inline-block; border:1px solid var(--line); padding:4px 10px; border-radius:3px;}

  .empty-state{background:var(--panel); border:1px dashed var(--line); border-radius:var(--radius); padding:40px 20px; text-align:center; color:var(--ink-dim); max-width:520px;}

  /* ---------------- MODAL ---------------- */
  .modal-backdrop{position:fixed; inset:0; background:rgba(0,0,0,0.65); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;}
  .modal{background:var(--bg-alt); border:1px solid var(--line); border-radius:8px; max-width:600px; width:100%; max-height:88vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,0.5); animation:modalIn .18s ease;}
  @keyframes modalIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
  .modal-head{background:var(--panel-2); border-bottom:1px solid var(--line); padding:16px 22px; display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .modal-head h2{font-size:22px;}
  .modal-close{background:var(--panel); border:1px solid var(--line); color:var(--ink); width:28px; height:28px; border-radius:4px; font-size:14px;}
  .modal-body{padding:20px 22px 24px;}
  .modal-body h4{font-family:var(--cond); font-size:12.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--accent); margin:16px 0 8px;}
  .modal-body h4:first-child{margin-top:0;}
  .ing-list{list-style:none; margin:0; padding:0; display:grid; gap:5px;}
  .ing-list li{font-size:13.5px; display:flex; gap:8px;}
  .ing-list .q{font-family:var(--mono); font-weight:700; color:var(--accent); min-width:64px;}
  .step-list{margin:0; padding-left:18px; display:grid; gap:7px; font-size:13.5px; color:var(--ink);}
  .yt-embed{position:relative; width:100%; aspect-ratio:16/9; border-radius:8px; overflow:hidden; margin-bottom:10px; background:#000; border:1px solid var(--line);}
  .yt-embed iframe{width:100%; height:100%; border:0; display:block;}
  .ref-link{display:block; font-size:12.5px; color:var(--accent); word-break:break-all; margin-bottom:8px; text-decoration:underline; font-family:var(--mono);}
  .modal-footer{display:flex; gap:10px; margin-top:18px;}
  .nutri-row{display:flex; gap:16px; flex-wrap:wrap; margin-bottom:6px;}

function recipeById(id){ return state.recipes.find(r => r.id === id); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function getYouTubeId(url){
  try{
    const u = new URL(url);
    const host = u.hostname.replace(/^www\./,"").replace(/^m\./,"");
    if(host === "youtu.be") return u.pathname.slice(1).split("/")[0] || null;
    if(host === "youtube.com"){
      if(u.pathname === "/watch") return u.searchParams.get("v");
      const embedMatch = u.pathname.match(/^\/embed\/([^/]+)/);
      if(embedMatch) return embedMatch[1];
      const shortsMatch = u.pathname.match(/^\/shorts\/([^/]+)/);
      if(shortsMatch) return shortsMatch[1];
    }
    return null;
  }catch(err){ return null; }
}
function fmtQty(q){ const map={0.25:"¼",0.5:"½",0.75:"¾",0.33:"⅓",0.67:"⅔"}; return map[q] !== undefined ? map[q] : String(q); }
function cartItemFor(recipeId){ return state.cart.find(c => c.recipeId === recipeId); }
function recipeToDraft(r){
  return {
    title: r.title, servings: r.servings, time: r.time, meals: r.meals, cuisine: r.cuisine,
    calories: r.calories, protein: r.protein, carbs: r.carbs, fat: r.fat, fiber: r.fiber,
    ingredientsRaw: r.ingredients.map(i => `${i.qty}, ${i.unit}, ${i.name}, ${i.cat}`).join("\n"),
    stepsRaw: r.steps.join("\n"),
    linksRaw: (r.links||[]).join("\n"),
  };
}
function allCuisines(){ return [...DEFAULT_CUISINES, ...state.customCuisines]; }
function cuisineKnown(name){ return allCuisines().some(c => c.toLowerCase() === name.toLowerCase()); }
function ensureCuisineKnown(name){ if(name && !cuisineKnown(name)) state.customCuisines.push(name); }
function totalCartServings(){ return state.cart.reduce((n,c)=>n+c.pegs.length,0); }
function daySlotIds(day){ const ids = CORE_MEALS.map(m=>`${day}-${m}`); if(state.snackEnabled.has(day)) ids.push(`${day}-Snack`); return ids; }
function slotOccupant(slotId){
  const occ = state.slots[slotId];
  if(!occ) return null;
  const item = state.cart.find(c => c.cartId === occ.cartId);
  return item ? recipeById(item.recipeId) : null;
}
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> t.classList.remove("show"), 1900);
}

/* ============================================================
   CART / SLOT LOGIC
============================================================ */
function addToCart(recipeId){
  const recipe = recipeById(recipeId);
  let item = cartItemFor(recipeId);
  if(!item){ item = {cartId: nextCartId++, recipeId, pegs: []}; state.cart.push(item); }
  const batch = item.pegs.length ? Math.max(...item.pegs.map(p=>p.batch)) + 1 : 1;
  for(let i=0;i<recipe.servings;i++) item.pegs.push({pegId: nextPegId++, slot: null, batch});
  showToast(batch > 1 ? `Added another batch of ${recipe.title}` : `${recipe.title} added to loadout pool`);
  render();
}
function removeFromCart(cartId){
  const item = state.cart.find(c => c.cartId === cartId);
  if(!item) return;
  item.pegs.forEach(p => { if(p.slot) state.slots[p.slot] = null; });
  state.cart = state.cart.filter(c => c.cartId !== cartId);
  render();
}
function removeBatch(cartId, batch){
  const item = state.cart.find(c => c.cartId === cartId);
  if(!item) return;
  const recipe = recipeById(item.recipeId);
  const toRemove = item.pegs.filter(p => p.batch === batch);
  toRemove.forEach(p => { if(p.slot) state.slots[p.slot] = null; });
  item.pegs = item.pegs.filter(p => p.batch !== batch);
  if(item.pegs.length === 0) state.cart = state.cart.filter(c => c.cartId !== cartId);
  showToast(`Removed that batch — kept your other ${recipe.title} servings`);
  render();
}
function placePegInSlot(cartId, pegId, slotId){
  const item = state.cart.find(c => c.cartId === cartId);
  const peg = item && item.pegs.find(p => p.pegId === pegId);
  if(!peg) return;
  const existing = state.slots[slotId];
  if(existing){
    const exItem = state.cart.find(c => c.cartId === existing.cartId);
    const exPeg = exItem && exItem.pegs.find(p => p.pegId === existing.pegId);
    if(exPeg) exPeg.slot = null;
  }
  if(peg.slot) state.slots[peg.slot] = null;
  peg.slot = slotId;
  state.slots[slotId] = {cartId, pegId};
  render();
}
function openSlotPicker(slotId){
  state.modal = {type:"slotPicker", slotId};
  render();
}
function assignFirstAvailable(cartId, slotId){
  const item = state.cart.find(c => c.cartId === cartId);
  const peg = item && item.pegs.find(p => !p.slot);
  if(!peg) return;
  state.modal = null;
  placePegInSlot(cartId, peg.pegId, slotId);
}
function clearSlot(slotId){
  const occ = state.slots[slotId];
  if(!occ) return;
  const item = state.cart.find(c => c.cartId === occ.cartId);
  const peg = item && item.pegs.find(p => p.pegId === occ.pegId);
  if(peg) peg.slot = null;
  state.slots[slotId] = null;
  render();
}
function toggleSnackDay(day){
  if(state.snackEnabled.has(day)){
    clearSlot(`${day}-Snack`);
    delete state.slots[`${day}-Snack`];
    state.snackEnabled.delete(day);
  } else {
    state.snackEnabled.add(day);
    state.slots[`${day}-Snack`] = null;
  }
  render();
}

/* ============================================================
   NUTRITION
============================================================ */
function dayNutrition(day){
  const ids = daySlotIds(day);
  let cal=0, protein=0, carbs=0, fat=0, fiber=0, count=0;
  ids.forEach(id => { const r = slotOccupant(id); if(r){ cal+=r.calories; protein+=r.protein; carbs+=r.carbs; fat+=r.fat; fiber+=(r.fiber||0); count++; } });
  return {cal, protein, carbs, fat, fiber, count};
}
function weekNutrition(){
  const totals = {cal:0, protein:0, carbs:0, fat:0, fiber:0};
  DAYS.forEach(d => { const n = dayNutrition(d); totals.cal+=n.cal; totals.protein+=n.protein; totals.carbs+=n.carbs; totals.fat+=n.fat; totals.fiber+=n.fiber; });
  return totals;
}

function buildStatsContext(){
  const week = weekNutrition();
  const daily = DAYS.map(d => dayNutrition(d));
  const filledMeals = daily.reduce((n,d)=>n+d.count,0);
  const totalSlots = DAYS.reduce((n,d)=>n+daySlotIds(d).length,0);

  const plannedDays = daily.map((d,i)=>({...d, day:DAYS[i]})).filter(d=>d.count>0);
  let peak=null, light=null;
  if(plannedDays.length){
    peak = plannedDays.reduce((a,b)=> b.cal>a.cal ? b : a);
    light = plannedDays.reduce((a,b)=> b.cal<a.cal ? b : a);
  }

  const servingsEquipped = state.cart.reduce((n,c)=>n+c.pegs.filter(p=>p.slot).length,0);
  const daysFullyPlanned = DAYS.filter(d => CORE_MEALS.every(m=>state.slots[`${d}-${m}`])).length;
  const proteinPct = week.cal ? Math.round((week.protein*4/week.cal)*100) : 0;
  const snacksEquipped = DAYS.filter(d => state.snackEnabled.has(d) && state.slots[`${d}-Snack`]).length;

  return {
    week, filledMeals, totalSlots, peak, light, proteinPct, daysFullyPlanned, snacksEquipped,
    servingsEquipped, servingsTotal: totalCartServings(), poolRecipes: state.cart.length,
  };
}

============================================================ */
function renderSupply(){
  const hasRecipeList = state.confirmedOnce && state.cart.length > 0;

  const agg = new Map();
  if(hasRecipeList){
    state.cart.forEach(item => {
      const r = recipeById(item.recipeId);
      r.ingredients.forEach(ing => {
        const key = `${ing.name.toLowerCase()}|${ing.unit.toLowerCase()}`;
        if(!agg.has(key)) agg.set(key, {name:ing.name, unit:ing.unit, cat:ing.cat, qty:0, sources:new Set(), manual:false});
        const entry = agg.get(key);
        entry.qty += ing.qty;
        entry.sources.add(r.title);
      });
    });
  }
  state.extraItems.forEach(item => {
    const key = `extra-${item.id}`;
    agg.set(key, {name:item.name, unit:item.unit, cat:item.cat, qty:item.qty, sources:new Set(), manual:true, extraId:item.id});
  });

  const byCat = {};
  agg.forEach(entry => { (byCat[entry.cat] ||= []).push(entry); });
  Object.values(byCat).forEach(list => list.sort((a,b)=>a.name.localeCompare(b.name)));
  const cats = CAT_ORDER.filter(c => byCat[c]);

  const addItemRow = `
    <div class="add-item-row">
      <input type="text" id="extra-item-name" placeholder="Item name (e.g. Paper towels)">
      <input type="text" id="extra-item-qty" placeholder="Qty" value="1">
      <input type="text" id="extra-item-unit" placeholder="Unit (optional)">
      <select id="extra-item-cat">
        ${CAT_ORDER.map(c => `<option value="${c}" ${c==='Other'?'selected':''}>${c}</option>`).join("")}
      </select>
      <button class="btn btn-accent btn-sm" data-add-extra-item>+ Add to list</button>
    </div>
  `;

  const lede = hasRecipeList
    ? `<div class="supply-lede">CONSOLIDATED FROM ${state.cart.length} RECIPE${state.cart.length!==1?'S':''} · ${totalCartServings()} SERVINGS · OVERLAPPING INGREDIENTS MERGED</div>`
    : `<div class="supply-lede">${state.confirmedOnce ? "YOUR LOADOUT POOL IS EMPTY" : "NO WEEKLY LOADOUT CONFIRMED YET"} — ADD YOUR OWN ITEMS BELOW, OR HEAD TO THE BUILDER TO PULL IN RECIPE INGREDIENTS</div>`;

  if(cats.length === 0){
    return `
      ${addItemRow}
      <div class="empty-state">
        <p><strong>Your list is empty.</strong></p>
        <p>Jot down a few items above — like something you'd normally scribble on paper before a store run — or confirm your weekly loadout in the Builder to pull in recipe ingredients automatically.</p>
      </div>
    `;
  }

  return `
    ${addItemRow}
    ${lede}
    <div class="shop-cats">
      ${cats.map(cat => `
        <div class="shop-cat">
          <h4>${cat}</h4>
          ${byCat[cat].map(entry => {
            const key = entry.manual ? `extra-${entry.extraId}` : `${entry.name.toLowerCase()}|${entry.unit.toLowerCase()}`;
            const checked = state.shoppingChecked.has(key);
            return `
              <div class="shop-row ${checked?'checked':''}">
                <button class="shop-check ${checked?'on':''}" data-shop-toggle="${esc(key)}">${checked?'✓':''}</button>
                <div class="shop-text">
                  <span class="shop-qty">${fmtQty(entry.qty)}${entry.unit?' '+esc(entry.unit):''}</span>${esc(entry.name)}
                  <span class="shop-src">${entry.manual ? "Added by you" : [...entry.sources].join(", ")}</span>
                </div>
                <button class="info-btn" data-ingredient-info="${esc(entry.name)}" data-ingredient-cat="${esc(entry.cat)}" title="What is this?">
                  <svg viewBox="0 0 12 12" width="10" height="10" fill="currentColor"><circle cx="6" cy="3.2" r="1.15"/><rect x="5.1" y="5.3" width="1.8" height="5" rx="0.5"/></svg>
                </button>
                ${entry.manual ? `<button class="extra-remove" data-remove-extra-item="${entry.extraId}" title="Remove this item">✕</button>` : ""}
              </div>
            `;
          }).join("")}
        </div>
      `).join("")}
    </div>
  `;
}

const UNIT_WORDS = {
  cups:"cups", cup:"cup", "c.":"cup",
  tablespoons:"tbsp", tablespoon:"tbsp", tbsp:"tbsp", "tbsp.":"tbsp", tbs:"tbsp",
  teaspoons:"tsp", teaspoon:"tsp", tsp:"tsp", "tsp.":"tsp",
  ounces:"oz", ounce:"oz", oz:"oz", "oz.":"oz",
  pounds:"lb", pound:"lb", lbs:"lb", lb:"lb", "lb.":"lb",
  grams:"g", gram:"g", g:"g",
  kilograms:"kg", kilogram:"kg", kg:"kg",
  milliliters:"ml", milliliter:"ml", ml:"ml",
  liters:"l", liter:"l", l:"l",
  cans:"cans", can:"can",
  cloves:"cloves", clove:"clove",
  bunches:"bunch", bunch:"bunch",
  slices:"slices", slice:"slice",
  pinch:"pinch", pinches:"pinch",
  scoops:"scoops", scoop:"scoop",
};
function guessIngredientCategory(name){
  const n = name.toLowerCase();
  const protein = ["chicken","beef","turkey","salmon","fish","shrimp","pork","steak","tofu","bacon","sausage","lamb","tuna","tilapia"];
  const dairy = ["milk","cheese","yogurt","cream","butter","egg"];
  const bakery = ["bread","tortilla","bun","roll","bagel","baguette","pita","naan"];
  const produce = ["lettuce","tomato","onion","pepper","garlic","carrot","potato","spinach","cucumber","apple","banana","lemon","lime","avocado","broccoli","celery","mushroom","basil","cilantro","parsley","ginger","zucchini","corn","kale","herb"];
  if(protein.some(w=>n.includes(w))) return "Protein";
  if(dairy.some(w=>n.includes(w))) return "Dairy";
  if(bakery.some(w=>n.includes(w))) return "Bakery";
  if(produce.some(w=>n.includes(w))) return "Produce";
  return "Pantry";
}
function parseQtyToken(tok){
  if(tok.includes("/")){
    const [a,b] = tok.split("/").map(Number);
    if(b) return a/b;
  }
  const n = parseFloat(tok);
  return isNaN(n) ? null : n;
}
function parseIngredientLine(line){
  let s = line.trim().replace(/^[-•*]\s*/, "");
  const fracMap = {"¼":"1/4","½":"1/2","¾":"3/4","⅓":"1/3","⅔":"2/3","⅛":"1/8","⅜":"3/8","⅝":"5/8","⅞":"7/8"};
  Object.keys(fracMap).forEach(u => { s = s.split(u).join(" " + fracMap[u]); });
  s = s.trim();

  let qty = 1;
  const qtyMatch = s.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d*\.\d+|\d+)/);
  if(qtyMatch){
    const raw = qtyMatch[0].trim();
    if(raw.includes(" ")){
      const [whole, frac] = raw.split(" ");
      qty = (parseFloat(whole)||0) + (parseQtyToken(frac)||0);
    } else {
      qty = parseQtyToken(raw) ?? 1;
    }
    s = s.slice(qtyMatch[0].length).trim();
  }

  let unit = "";
  const wordMatch = s.match(/^([a-zA-Z.]+)\s+/);
  if(wordMatch && UNIT_WORDS[wordMatch[1].toLowerCase()]){
    unit = UNIT_WORDS[wordMatch[1].toLowerCase()];
    s = s.slice(wordMatch[0].length).trim();
  }
  s = s.replace(/^of\s+/i, "").trim();
  const name = (s.split(",")[0] || line).trim() || "ingredient";
  return {qty: qty || 1, unit, name, cat: guessIngredientCategory(name)};
}
function firstNumber(val){
  if(val === undefined || val === null) return 0;
  const m = String(val).match(/[\d.]+/);
  return m ? Math.round(parseFloat(m[0])) : 0;
}
function parseISODuration(iso){
  if(!iso) return null;
  const m = String(iso).match(/PT(?:(\d+)H)?(?:(\d+)M)?/);
  if(!m || (!m[1] && !m[2])) return null;
  return (parseInt(m[1]||0,10)*60) + parseInt(m[2]||0,10);
}
function extractSteps(instr){
  if(!instr) return [];
  if(typeof instr === "string") return instr.split(/\n+/).map(s=>s.trim()).filter(Boolean);
  if(Array.isArray(instr)){
    const out = [];
    instr.forEach(step => {
      if(typeof step === "string"){ out.push(step); return; }
      if(!step) return;
      if(step["@type"] === "HowToSection" && Array.isArray(step.itemListElement)){
        step.itemListElement.forEach(s => out.push(s.text || s.name || ""));
      } else {
        out.push(step.text || step.name || "");
      }
    });
    return out.filter(Boolean);
  }
  return [];
}
function searchForRecipe(node){
  if(!node) return null;
  if(Array.isArray(node)){
    for(const item of node){ const found = searchForRecipe(item); if(found) return found; }
    return null;
  }
  if(typeof node === "object"){
    const type = node["@type"];
    const typeStr = Array.isArray(type) ? type.join(",") : (type || "");
    if(typeStr.includes("Recipe")) return node;
    if(node["@graph"]) return searchForRecipe(node["@graph"]);
  }
  return null;
}
function findRecipeJsonLd(doc){
  const scripts = doc.querySelectorAll('script[type="application/ld+json"]');
  for(const script of scripts){
    try{
      const data = JSON.parse(script.textContent);
      const found = searchForRecipe(data);
      if(found) return found;
    }catch(err){ /* malformed JSON-LD on the page — skip it */ }
  }
  return null;
}
async function fetchViaProxy(url){
  const proxies = [
    "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
    "https://corsproxy.io/?" + encodeURIComponent(url),
  ];
  let lastErr = null;
  for(const p of proxies){
    try{
      const res = await fetch(p);
      if(res.ok) return await res.text();
      lastErr = new Error("Bad response: " + res.status);
    }catch(err){ lastErr = err; }
  }
  throw lastErr || new Error("Could not reach that page");
}
async function fetchAndParseRecipe(url){
  const html = await fetchViaProxy(url);
  const doc = new DOMParser().parseFromString(html, "text/html");
  const raw = findRecipeJsonLd(doc);
  if(!raw) return null;

  const title = (raw.name || "Untitled Recipe").trim();
  const yieldVal = Array.isArray(raw.recipeYield) ? raw.recipeYield[0] : raw.recipeYield;
  const servings = firstNumber(yieldVal) || 4;
  const time = parseISODuration(raw.totalTime) || parseISODuration(raw.cookTime) || parseISODuration(raw.prepTime) || 30;
  const cuisineRaw = Array.isArray(raw.recipeCuisine) ? raw.recipeCuisine[0] : raw.recipeCuisine;
  const nutrition = raw.nutrition || {};
  const ingLines = Array.isArray(raw.recipeIngredient) ? raw.recipeIngredient : (Array.isArray(raw.ingredients) ? raw.ingredients : []);
  const ingredientsRaw = ingLines.map(line => {
    const p = parseIngredientLine(String(line));
    return `${p.qty}, ${p.unit}, ${p.name}, ${p.cat}`;
  }).join("\n");
  const stepsRaw = extractSteps(raw.recipeInstructions).join("\n");

  return {
    title, servings, time,
    meals: ["dinner"],
    cuisine: cuisineRaw ? String(cuisineRaw).trim() : "",
    calories: firstNumber(nutrition.calories),
    protein: firstNumber(nutrition.proteinContent),
    carbs: firstNumber(nutrition.carbohydrateContent),
    fat: firstNumber(nutrition.fatContent),
    fiber: firstNumber(nutrition.fiberContent),
    ingredientsRaw: ingredientsRaw || "1, , see original recipe, Pantry",
    stepsRaw: stepsRaw || "",
    linksRaw: url,
  };
}

function buildAIPrompt(url){
  const target = url || "[paste the recipe link OR the full recipe text here]";
  return `I'm going to give you a recipe (either a link, or pasted recipe text). Convert it into this exact JSON format and output ONLY the JSON — no other text, no markdown code fences, no explanation.

{
  "title": "Recipe Name",
  "servings": 4,
  "time": 30,
  "cuisine": "e.g. Italian, Mexican, Asian, American — leave blank if unsure",
  "calories": 0,
  "protein": 0,
  "carbs": 0,
  "fat": 0,
  "fiber": 0,
  "youtubeUrl": "",
  "ingredients": [
    {"qty": 2, "unit": "cups", "name": "ingredient name", "category": "Produce"}
  ],
  "steps": ["Step 1", "Step 2"]
}

Rules:
- "time" is total time in minutes (prep + cook combined).
- Nutrition values are per serving. Follow these steps in order:
  1. First, look for explicit nutrition facts on the page (often in a "Nutrition Facts" box near the recipe card). If present, use those exact numbers.
  2. If no nutrition facts are listed anywhere, make a genuine, careful estimate based on the actual ingredients and quantities in the recipe, divided by the serving count. Put in real effort here — don't skip straight to guessing.
  3. If you can't produce an estimate you're reasonably confident in, use 0 for that field instead. Do NOT fabricate, round to a "plausible-sounding" number, or hallucinate a value just to fill the field in — leaving it at 0 is strongly preferred over a number that's just made up. Accuracy matters more than completeness here.
- "youtubeUrl": if the page embeds or clearly links to a YouTube video of the recipe being made, put that video's URL here. Leave it as an empty string "" if there isn't one — don't search elsewhere for one or guess a link that might not actually match this recipe.
- "category" for every ingredient must be exactly one of: Produce, Protein, Dairy, Bakery, Pantry, Other.
- "unit" should be short (cups, tbsp, tsp, oz, lb, g, cans, cloves, etc.) or an empty string "" for whole items like "2 onions".

Recipe: ${target}
If you can't access links directly, ask me to paste the recipe text instead, then use that.`;
}
async function copyToClipboard(text){
  try{
    await navigator.clipboard.writeText(text);
    return true;
  }catch(err){
    return false;
  }
}

}
function parseAIResponseJSON(text){
  if(!text) return null;
  let cleaned = text.trim().replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/i, "").trim();
  const start = cleaned.indexOf("{");
  const end = cleaned.lastIndexOf("}");
  if(start === -1 || end === -1 || end <= start) return null;
  let data;
  try{ data = JSON.parse(cleaned.slice(start, end+1)); }catch(err){ return null; }

  const title = (data.title || "Untitled Recipe").toString().trim();
  const servings = parseInt(data.servings,10) || 4;
  const time = parseInt(data.time,10) || 30;
  const cuisine = data.cuisine ? String(data.cuisine).trim() : "";
  const ingArr = Array.isArray(data.ingredients) ? data.ingredients : [];
  const ingredientsRaw = ingArr.map(ing => {
    const qty = ing && ing.qty !== undefined ? ing.qty : 1;
    const unit = ing && ing.unit ? String(ing.unit).trim() : "";
    const name = (ing && ing.name ? String(ing.name).trim() : "ingredient") || "ingredient";
    const rawCat = ing && ing.category ? String(ing.category).trim() : "";
    const cat = CAT_ORDER.find(c => c.toLowerCase() === rawCat.toLowerCase()) || "Other";
    return `${qty}, ${unit}, ${name}, ${cat}`;
  }).join("\n");
  const stepsArr = Array.isArray(data.steps) ? data.steps : [];
  const stepsRaw = stepsArr.map(s=>String(s).trim()).filter(Boolean).join("\n");
  const youtubeUrl = (data.youtubeUrl && /^https?:\/\//i.test(String(data.youtubeUrl).trim())) ? String(data.youtubeUrl).trim() : "";

  return {
    title, servings, time, meals:["dinner"], cuisine,
    calories: Math.round(Number(data.calories))||0,
    protein: Math.round(Number(data.protein))||0,
    carbs: Math.round(Number(data.carbs))||0,
    fat: Math.round(Number(data.fat))||0,
    fiber: Math.round(Number(data.fiber))||0,
    ingredientsRaw: ingredientsRaw || "1, , see AI response, Pantry",
    stepsRaw,
    youtubeUrl,
  };
}
function handleParseAIResponse(){
  const el = document.getElementById("f-ai-response");
  if(!el) return;
  const text = el.value.trim();
  if(!text){ showToast("Paste the AI's response first"); return; }
  const recipe = parseAIResponseJSON(text);
  if(!recipe){
    showToast("Couldn't read that as valid JSON — make sure you copied the AI's full reply");
    return;
  }
  const linkEl = document.getElementById("f-link");
  const url = linkEl ? linkEl.value.trim() : (state.modal.linkValue || "");
  const linkParts = [];
  if(url && /^https?:\/\//i.test(url)) linkParts.push(url);
  if(recipe.youtubeUrl && recipe.youtubeUrl !== url) linkParts.push(recipe.youtubeUrl);
  recipe.linksRaw = [...new Set(linkParts)].join("\n");
  delete recipe.youtubeUrl;
  state.modal = {type:"add", subtab:"manual", linkValue:url, parsing:false, draft:{fromParse:true, ...recipe}};
  showToast(`${recipe.title} imported — review before saving`);
  render();
}

async function handleParseLink(){
  const urlInput = document.getElementById("f-link");
  const url = urlInput.value.trim();
  if(!url){ showToast("Paste a link first"); return; }
  let parsed;
  try{ parsed = new URL(url); }catch(err){ showToast("That doesn't look like a valid URL"); return; }
  if(!/^https?:$/.test(parsed.protocol)){ showToast("Link must start with http:// or https://"); return; }

  state.modal.linkValue = url;
  state.modal.parsing = true;
  state.modal.parseError = null;
  render();

  try{

      state.modal = {type:"add", subtab:"link", linkValue:url, parsing:false,

    }

  }catch(err){
    state.modal = {type:"add", subtab:"link", linkValue:url, parsing:false,
      parseError:"Couldn't reach that page right now. Double-check the link, or try again in a moment."};

  }

function handleAddRecipeSubmit(){
  const title = document.getElementById("f-title").value.trim();
  if(!title){ showToast("Give your recipe a title before saving"); return; }
  const servings = parseInt(document.getElementById("f-servings").value,10) || 4;
  const time = parseInt(document.getElementById("f-time").value,10) || 30;
  const meals = Array.from(document.getElementById("f-meals").selectedOptions).map(o=>o.value);
  let cuisine = document.getElementById("f-cuisine").value.trim();
  if(cuisine){
    const match = allCuisines().find(c => c.toLowerCase() === cuisine.toLowerCase());
    if(match) cuisine = match; else ensureCuisineKnown(cuisine);
  }
  const calories = parseInt(document.getElementById("f-cal").value,10) || 0;
  const protein = parseInt(document.getElementById("f-protein").value,10) || 0;
  const carbs = parseInt(document.getElementById("f-carbs").value,10) || 0;
  const fat = parseInt(document.getElementById("f-fat").value,10) || 0;
  const fiber = parseInt(document.getElementById("f-fiber").value,10) || 0;
  const rawIngredients = document.getElementById("f-ingredients").value.trim();
  const rawSteps = document.getElementById("f-steps").value.trim();

  const ingredients = rawIngredients.split("\n").map(l=>l.trim()).filter(Boolean).map(line => {
    const parts = line.split(",").map(p=>p.trim());
    return {qty: parseFloat(parts[0])||1, unit: parts[1]||"", name: parts[2]||"ingredient", cat: CAT_ORDER.includes(parts[3])?parts[3]:"Pantry"};
  });
  if(ingredients.length===0) ingredients.push({qty:1, unit:"", name:"see recipe notes", cat:"Pantry"});

  const steps = rawSteps ? rawSteps.split("\n").map(s=>s.trim()).filter(Boolean) : ["Prepare ingredients as needed.","Cook using your preferred method.","Portion into servings and store or serve."];

  const rawLinks = document.getElementById("f-links").value.trim();
  const links = [...new Set(
    rawLinks.split("\n").map(l=>l.trim()).filter(Boolean).map(l => /^https?:\/\//i.test(l) ? l : "https://" + l)
  )];

  const editingId = state.modal && state.modal.editingId;
  const finalMeals = meals.length ? meals : ["dinner"];
  const finalCuisine = cuisine || "American";

  if(editingId){
    const existing = state.recipes.find(r => r.id === editingId);
    if(existing){
      Object.assign(existing, {
        title, servings, time, meals: finalMeals, cuisine: finalCuisine,
        links, calories, protein, carbs, fat, fiber, ingredients, steps,
      });
      showToast(`${title} updated`);
    } else {
      showToast("Couldn't find that recipe to update");
    }
  } else {
    const emojiPool = ["🍲","🥘","🍛","🥙","🍜","🫔"];
    state.recipes.unshift({
      id: nextRecipeId++, title, emoji: emojiPool[Math.floor(Math.random()*emojiPool.length)],
      servings, time, meals: finalMeals, tags:["community"], cuisine: finalCuisine,
      links,
      calories, protein, carbs, fat, fiber, ingredients, steps,
    });
    showToast(`${title} saved to Armory`);
  }
  state.modal = null;
  state.section = "armory";
  render();
}

function positionIngredientPopover(){
  const pop = document.getElementById("ing-pop");
  if(!pop || !state.ingredientPopover) return;
  const btn = document.querySelector(`[data-ingredient-info="${CSS.escape(state.ingredientPopover.name)}"]`);
  if(!btn){ state.ingredientPopover = null; pop.remove(); return; }
  const rect = btn.getBoundingClientRect();
  const scrollX = window.scrollX, scrollY = window.scrollY;
  const margin = 12;
  const popW = pop.offsetWidth || 280;
  let left = rect.right + scrollX + 12;
  let flip = false;
  if(left + popW > scrollX + window.innerWidth - margin){
    left = rect.left + scrollX - popW - 12;
    flip = true;
  }
  if(left < scrollX + margin) left = scrollX + margin;
  pop.style.left = left + "px";
  pop.style.top = (rect.top + scrollY + rect.height/2) + "px";
  pop.classList.toggle("flip", flip);
}

    if(Array.isArray(d.visibleDayNutrients)) state.visibleDayNutrients = new Set(d.visibleDayNutrients);
    if(Array.isArray(d.extraItems)) state.extraItems = d.extraItems;

function render(){
  renderRail();
  renderTopbar();
  const app = document.getElementById("app");
  if(state.section === "armory") app.innerHTML = renderArmory();
  else if(state.section === "builder") app.innerHTML = renderBuilder();
  else if(state.section === "supply") app.innerHTML = renderSupply();
  else app.innerHTML = renderLocked(state.section);
  renderModal();
  document.getElementById("ing-pop-root").innerHTML = ingredientPopoverHTML();
  positionIngredientPopover();
  saveState();
}

function closestBeforeStop(el, matchSelector, stopSelector){
  let node = el;
  while(node && node.nodeType === 1){
    if(node.matches(matchSelector)) return node;
    if(node.matches(stopSelector)) return null;
    node = node.parentElement;
  }
  return null;
}

/* ============================================================
   EVENTS
============================================================ */
document.addEventListener("click", (e) => {
  if(state.ingredientPopover && !e.target.closest(".ing-pop") && !e.target.closest("[data-ingredient-info]")){
    state.ingredientPopover = null;
    render();
  }

  const sectionBtn = e.target.closest("[data-section]");
  if(sectionBtn){ state.section = sectionBtn.dataset.section; state.ingredientPopover = null; render(); return; }

  const filterBtn = e.target.closest("[data-filter]");
  if(filterBtn){ state.filter = filterBtn.dataset.filter; render(); return; }

  const cuisineFilterBtn = e.target.closest("[data-cuisine-filter]");
  if(cuisineFilterBtn){ state.cuisineFilter = cuisineFilterBtn.dataset.cuisineFilter; render(); return; }

  const openCuisineBtn = e.target.closest("[data-open-cuisine]");
  if(openCuisineBtn){ state.modal = {type:"cuisine", value:""}; render(); return; }

  const snackBtn = e.target.closest("[data-toggle-snack]");
  if(snackBtn){ toggleSnackDay(snackBtn.dataset.toggleSnack); return; }

  const statsEditBtn = e.target.closest("[data-toggle-stats-edit]");
  if(statsEditBtn){ state.statsEditMode = !state.statsEditMode; render(); return; }

  const removeStatBtn = e.target.closest("[data-remove-stat]");
  if(removeStatBtn){ state.visibleStats.delete(removeStatBtn.dataset.removeStat); render(); return; }

  const addStatBtn = e.target.closest("[data-add-stat]");
  if(addStatBtn){ state.visibleStats.add(addStatBtn.dataset.addStat); render(); return; }

  const dayNutEditBtn = e.target.closest("[data-toggle-daynutrients-edit]");
  if(dayNutEditBtn){ state.dayNutrientsEditMode = !state.dayNutrientsEditMode; render(); return; }

  const removeDayNutBtn = e.target.closest("[data-remove-daynut]");
  if(removeDayNutBtn){ state.visibleDayNutrients.delete(removeDayNutBtn.dataset.removeDaynut); render(); return; }

  const addDayNutBtn = e.target.closest("[data-add-daynut]");
  if(addDayNutBtn){ state.visibleDayNutrients.add(addDayNutBtn.dataset.addDaynut); render(); return; }

  const addCartBtn = e.target.closest("[data-add-cart]");
  if(addCartBtn){
    addToCart(parseInt(addCartBtn.dataset.addCart,10));
    if(addCartBtn.dataset.closeAfter !== undefined) state.modal = null;
    render();
    return;
  }
  const removeCartBtn = e.target.closest("[data-remove-cart]");
  if(removeCartBtn){ removeFromCart(parseInt(removeCartBtn.dataset.removeCart,10)); return; }

  const removeBatchBtn = e.target.closest("[data-remove-batch]");
  if(removeBatchBtn){ removeBatch(parseInt(removeBatchBtn.dataset.removeBatch,10), parseInt(removeBatchBtn.dataset.batch,10)); return; }

  const openDetail = e.target.closest("[data-open-detail]");
  if(openDetail){ state.modal = {type:"detail", recipeId: parseInt(openDetail.dataset.openDetail,10)}; render(); return; }

  const editRecipeBtn = e.target.closest("[data-edit-recipe]");
  if(editRecipeBtn){
    const r = recipeById(parseInt(editRecipeBtn.dataset.editRecipe,10));
    if(r){ state.modal = {type:"add", subtab:"manual", editingId:r.id, draft:recipeToDraft(r)}; render(); }
    return;
  }

  const deleteRecipeBtn = e.target.closest("[data-delete-recipe]");
  if(deleteRecipeBtn){
    const id = parseInt(deleteRecipeBtn.dataset.deleteRecipe,10);
    if(state.cart.some(item => item.recipeId === id)){
      showToast("Remove it from your Loadout Pool first (Builder page), then delete it.");
    } else {
      state.modal = {type:"confirmDelete", recipeId:id};
      render();
    }
    return;
  }

  const confirmDeleteBtn = e.target.closest("[data-confirm-delete-recipe]");
  if(confirmDeleteBtn){
    const id = parseInt(confirmDeleteBtn.dataset.confirmDeleteRecipe,10);
    const r = recipeById(id);
    state.recipes = state.recipes.filter(rec => rec.id !== id);
    state.modal = null;
    showToast(`${r ? r.title : "Recipe"} deleted`);
    render();
    return;
  }

  const openAdd = e.target.closest("[data-open-add]");
  if(openAdd){ state.modal = {type:"add", subtab:"manual", draft:{}}; render(); return; }

  const subtabBtn = e.target.closest("[data-subtab]");
  if(subtabBtn){ state.modal.subtab = subtabBtn.dataset.subtab; render(); return; }

  const saveRecipeBtn = e.target.closest("[data-save-recipe]");
  if(saveRecipeBtn){ handleAddRecipeSubmit(); return; }

  const saveCuisineBtn = e.target.closest("[data-save-cuisine]");
  if(saveCuisineBtn){ handleAddCuisineSubmit(); return; }

  const copyAiPromptBtn = e.target.closest("[data-copy-ai-prompt]");
  if(copyAiPromptBtn){ handleCopyAIPrompt(); return; }

  const parseAiResponseBtn = e.target.closest("[data-parse-ai-response]");
  if(parseAiResponseBtn){ handleParseAIResponse(); return; }

  const assignBtn = e.target.closest("[data-assign-slot]");
  if(assignBtn){ assignFirstAvailable(parseInt(assignBtn.dataset.assignSlot,10), assignBtn.dataset.slotTarget); return; }

  const closeModal = closestBeforeStop(e.target, "[data-close-modal]", "[data-stop]");
  if(closeModal){ state.modal = null; render(); return; }

  const slotBtn = e.target.closest("[data-slot]");
  if(slotBtn){
    const slotId = slotBtn.dataset.slot;
    if(state.slots[slotId]) clearSlot(slotId);
    else openSlotPicker(slotId);
    return;
  }

  const confirmBtn = e.target.closest("[data-confirm-loadout]");
  if(confirmBtn){
    state.confirmedOnce = true;
    state.section = "supply";
    showToast("Loadout confirmed — supply list generated");
    render();
    return;
  }

  const shopToggle = e.target.closest("[data-shop-toggle]");
  if(shopToggle){
    const key = shopToggle.dataset.shopToggle;
    if(state.shoppingChecked.has(key)) state.shoppingChecked.delete(key); else state.shoppingChecked.add(key);
    render();
    return;
  }

  const closeIngPop = e.target.closest("[data-close-ing-pop]");
  if(closeIngPop){ state.ingredientPopover = null; render(); return; }

  const infoBtn = e.target.closest("[data-ingredient-info]");
  if(infoBtn){
    const name = infoBtn.dataset.ingredientInfo, cat = infoBtn.dataset.ingredientCat;
    state.ingredientPopover = (state.ingredientPopover && state.ingredientPopover.name === name) ? null : {name, cat};
    render();
    return;
  }

  const addExtraBtn = e.target.closest("[data-add-extra-item]");
  if(addExtraBtn){ addExtraItem(); return; }

  const removeExtraBtn = e.target.closest("[data-remove-extra-item]");
  if(removeExtraBtn){ removeExtraItem(parseInt(removeExtraBtn.dataset.removeExtraItem,10)); return; }
});
document.addEventListener("keydown", (e) => {
  if(e.key === "Enter" && e.target && e.target.id === "extra-item-name"){
    e.preventDefault();
    addExtraItem();
  }
});

function hexDragImage(label){
  const w = 40, h = 38;
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  canvas.style.position = "fixed";
  canvas.style.top = "-1000px";
  canvas.style.left = "-1000px";
  document.body.appendChild(canvas);
  const ctx = canvas.getContext("2d");
  const pts = [[0.25,0],[0.75,0],[1,0.5],[0.75,1],[0.25,1],[0,0.5]];
  ctx.beginPath();
  ctx.moveTo(pts[0][0]*w, pts[0][1]*h);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0]*w, pts[i][1]*h);
  ctx.closePath();
  ctx.fillStyle = "#E0A72E";
  ctx.fill();
  ctx.fillStyle = "#1A1502";
  ctx.font = "bold 14px 'JetBrains Mono', monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(label, w/2, h/2 + 1);
  return canvas;
}
document.addEventListener("dragstart", (e) => {
  const pegBtn = e.target.closest("[data-peg-cart]");
  if(!pegBtn || pegBtn.getAttribute("draggable") !== "true") return;
  const payload = {cartId: parseInt(pegBtn.dataset.pegCart,10), pegId: parseInt(pegBtn.dataset.pegId,10)};
  e.dataTransfer.setData("text/plain", JSON.stringify(payload));
  e.dataTransfer.effectAllowed = "move";
  const img = hexDragImage("1");
  e.dataTransfer.setDragImage(img, 20, 19);
  setTimeout(() => img.remove(), 0);
  pegBtn.classList.add("dragging");
});
document.addEventListener("dragend", (e) => {
  const pegBtn = e.target.closest("[data-peg-cart]");
  if(pegBtn) pegBtn.classList.remove("dragging");
  document.querySelectorAll(".lg-cell.drag-over").forEach(el => el.classList.remove("drag-over"));
});
document.addEventListener("dragenter", (e) => {
  const slot = e.target.closest(".lg-cell");
  if(slot && !slot.classList.contains("filled")) slot.classList.add("drag-over");
});
document.addEventListener("dragleave", (e) => {
  const slot = e.target.closest(".lg-cell");
  if(slot && !slot.contains(e.relatedTarget)) slot.classList.remove("drag-over");
});
document.addEventListener("dragover", (e) => {
  if(e.target.closest(".loadgrid")){
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
  }
});
document.addEventListener("drop", (e) => {
  const slotBtn = e.target.closest("[data-slot]");
  if(!slotBtn) return;
  e.preventDefault();
  slotBtn.classList.remove("drag-over");
  try{
    const data = JSON.parse(e.dataTransfer.getData("text/plain"));
    placePegInSlot(data.cartId, data.pegId, slotBtn.dataset.slot);
  }catch(err){}
});

loadState();
render();
</script>
